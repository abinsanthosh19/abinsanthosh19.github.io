<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abin's Portfolio</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Search Engine Optimization (SEO) tags -->
    <meta name="description" content="Official portfolio of Abin Santhosh (MJTech46). Python Developer specializing in Django, REST APIs, AI applications, backend development, Linux and open-source projects."/>
    <meta name="keywords" content="Abin Santhosh, MJTech46, Abin M Santhosh, MJ, MJ46, Manjaly, Python Developer,Django Developer,Backend Developer,Kerala Developer,IES College,Django REST Framework,Open Source,GitHub,Portfolio,AI Developer,Flask,Linux,Full Stack Developer"/>
    <meta name="author" content="Abin Santhosh" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.mj46.in/" />

    <!-- Open Graph (OG) tags -->
    <meta property="og:title" content="Abin Santhosh - Portfolio" />
    <meta property="og:description" content="Official portfolio of Abin Santhosh (MJTech46). Python Developer specializing in Django, REST APIs, AI applications, backend development, Linux and open-source projects." />
    <meta property="og:image" content="https://www.mj46.in/og-image.png?v=03-08-2026" />
    <meta property="og:url" content="https://www.mj46.in/" />
    <meta property="og:type" content="website" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/topbar.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/input.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    />
  </head>

  <body>
    <div class="app">
      <!-- ================= Sidebar ================= -->
      <aside class="sidebar">
        <!-- Top -->
        <div class="sidebar-top">
          <button class="icon-btn menu-btn" aria-label="Toggle Sidebar">
            ☰
          </button>

          <button class="new-chat-btn">
            <span><i data-lucide="plus"></i></span>
            <span>New Chat</span>
          </button>

          <button class="new-chat-btn" onclick="window.location.href='https://tools.mj46.in/'">
            <span><i data-lucide="wrench"></i></span>
            <span>Tools</span>
          </button>
        </div>

        <!-- Chat History -->
        <div class="chat-history">
          <h3>Today</h3>

          <button class="history-item active">Abin's Portfolio</button>

          <button class="history-item">HTML Project</button>

          <button class="history-item">CSS Grid Questions</button>

          <button class="history-item">JavaScript Notes</button>

          <h3>Yesterday</h3>

          <button class="history-item">React Roadmap</button>

          <button class="history-item">Python Interview</button>
        </div>

        <!-- Bottom -->
        <div class="sidebar-bottom">
          <button class="sidebar-item">Settings</button>

          <button class="sidebar-item">Help</button>

          <button class="profile-btn">
            <div class="avatar">M</div>

            <div class="profile-info">
              <strong>MJ Tech</strong>
              <small>Free Plan</small>
            </div>
          </button>
        </div>
      </aside>

      <!-- ================= Main ================= -->

      <main class="main-content">
        <!-- Header -->
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu">☰</button>

            <button class="model-selector">
              <span>ChatMJT</span>

              <i data-lucide="chevron-down" class="model-chevron"></i>
            </button>
          </div>

          <div class="topbar-right">
            <span class="plan-badge"> Free </span>

            <button class="header-btn" title="Notifications">
              <i data-lucide="bell"></i>
            </button>

            <button class="header-btn" title="Settings">
              <i data-lucide="settings"></i>
            </button>
          </div>
        </header>

        <!-- Conversation -->
        <section class="chat-area">
          <!-- Welcome Screen -->
          <div class="welcome">
            <h1>What can I help with?</h1>
          </div>

          <!-- Messages -->
          <div class="messages"></div>
        </section>

        <!-- Input -->
        <footer class="chat-input-container">
          <form class="chat-form">
            <button type="button" class="attach-btn">+</button>

            <textarea rows="1" placeholder="Ask anything..."></textarea>

            <button type="submit" class="send-btn">↑</button>
          </form>

          <p class="disclaimer">
            Rule-Based-AI can make mistakes. Check important info.
          </p>
        </footer>
      </main>
    </div>

    <!-- JavaScript -->

    <!-- External Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <!-- markdown JavaScript -->
    <script src="js/markdown.js"></script>
    <script src="js/markdown-loader.js"></script>
    <script src="js/knowledge-base.js"></script>

    <!-- UI JavaScript -->
    <script src="js/markdown.js"></script>
    <script src="js/codeblock.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/textarea.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="js/telemetry.js"></script>
  </body>
</html>
